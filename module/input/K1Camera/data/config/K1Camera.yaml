# Controls the minimum log level that NUClear log will display
log_level: INFO

# One entry per camera to subscribe to over the Booster SDK's DDS transport.
# topic: DDS topic name carrying sensor_msgs/Image. This is the ROS 2 topic path prefixed
#        with "rt/", e.g. ROS 2 topic /boostercamera/head/rgb -> rt/boostercamera/head/rgb.
#        Intrinsics are read from <topic>/camera_info.
# name:  name of the camera, used to differentiate between outputs
# id:    camera ID emitted in message::input::Image
cameras:
  - topic: rt/boostercamera/head/rgb
    name: Left Camera
    id: 0
    # Optional fallback lens parameters, used only until sensor_msgs/CameraInfo arrives on
    # <topic>/camera_info. Omit this block to rely on CameraInfo alone. focal_length and centre
    # are normalised by the image width:
    #   focal_length = fx / width
    #   centre       = [(cx - width / 2) / width, (cy - height / 2) / width]
    # lens:
    #   projection: RECTILINEAR
    #   focal_length: 0.0
    #   fov: 0.0
    #   centre: [0.0, 0.0]
    #   k: [0.0, 0.0]
