log_level: INFO

output:
  directory: recordings
  split_size: 5 * GiB

# You can put any messages that is emitted in the system here and it will be logged
# The below ones are just the most common and here as an example
# You can put any messages that is emitted in the system here and it will be logged
messages:
  # Input
  message.platform.RawSensors: false
  message.input.Image: false
  message.output.CompressedImage: false
  message.input.Message: true
  message.input.GameState: false
  # Vision
  message.vision.Balls: true # needed
  message.vision.Goals: false
  message.vision.GreenHorizon: false
  message.vision.FieldLines: false
  message.vision.FieldIntersections: false
  message.support.FieldDescription: false
  message.vision.VisualMesh: false
  message.vision.BoundingBoxes: false
  # Odometry and Localisation
  message.localisation.Ball: true # needed
  message.localisation.Field: true # needed
  message.localisation.Robot: false
  message.input.Sensors: true # needed
  message.support.FieldDescription: true # needed
  message.booster.BoosterOdometry: false
  # Behaviour state
  message.behaviour.state.WalkState: false
  message.purpose.Purpose: false
  message.strategy.TimeToBall: false
  # Logging and Support
  message.support.nusight.Overview: false
  message.eye.DataPoint: false
  message.nuclear.LogMessage: false
  message.nuclear.ReactionStatistics: false
  # Booster
  message.booster.NUSimBallSource: true  # needed
  message.booster.NUSimBallCrossings: true # needed
  message.planning.SavePlan: true # needed
