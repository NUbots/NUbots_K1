# Controls the minimum log level that NUClear log will display
log_level: INFO

# Constant-velocity UKF on the ball's world position and velocity, updated in image time. Validated against
# NUSim ground truth with tools::BallLocalisationBenchmark (nusim/ballvalidation role).
ukf:
  noise:
    measurement:
      # Detection position standard deviation (m): base + per_metre * range from the camera. This is the
      # frame-to-frame jitter, not the detector's slowly varying bias: in NUSim (Sep 2026) the jitter was 1-5 cm
      # (larger with range) while the bias reached 0.1-0.3 m. Sizing this to the bias makes the filter distrust
      # every detection and its velocity crawl after a kick. Kept a little above NUSim's jitter for real images.
      base: 0.03
      per_metre: 0.02
    process:
      # White-noise-acceleration spectral density (m^2/s^3): how quickly the ball's velocity may drift between
      # detections (friction, bumps). Kicks are handled by the association below, not by this noise.
      acceleration: 2.0

  initial:
    # Covariance the filter (re)starts with when it acquires a ball: position (m^2), velocity ((m/s)^2).
    # The velocity is unknown at acquisition, so start it wide.
    covariance:
      position: [0.1, 0.1]
      velocity: [4.0, 4.0]

motion:
  # Rolling resistance deceleration (m/s^2), applied against the velocity until the ball stops.
  # NUSim's ball slows at about 0.5 m/s^2; real turf is C_r * g with C_r around 0.05.
  rolling_deceleration: 0.5

association:
  # Squared Mahalanobis distance within which a detection updates the track (chi^2, 2 dof, 99%)
  gate: 9.21
  # Fastest the ball can travel (m/s). A detection outside the gate is taken as a kick only if the ball could
  # have got there since it was last accepted and the previous image saw it nearby too.
  max_ball_speed: 8.0
  # Velocity standard deviation (m/s) opened up on a kick, so the track can follow the new velocity
  kick_velocity_std: 4.0
  # Extra distance (m) a detection may move between consecutive images and still confirm itself
  confirm_radius: 0.3
  # Seconds without an accepted detection before the track may jump to a different confirmed detection
  reacquire_after: 0.5
  # Manoeuvre detection: a running average of the innovations (newest weighted by manoeuvre_smoothing). A kick
  # that stays inside the gate still produces innovations that keep pointing the same way; when the average's
  # normalised size passes manoeuvre_threshold the velocity covariance is opened up by kick_velocity_std.
  # With smoothing 0.5 a steady ball's average is ~chi^2(2)/3, so 3.0 is about its 99th percentile.
  manoeuvre_smoothing: 0.5
  manoeuvre_threshold: 3.0

# Robot to robot communication parameters
use_r2r_balls: true

# Maximum time in seconds before a teammates ball is discarded
team_ball_recency: 3.0

# Maximum acceptable standard deviation in meters for the combined team ball
team_guess_error: 0.5

# Maximimum time in seconds where we have not seen the ball before defaulting to team guesses
team_guess_default_timer: 2.0

# Maximum distance in meters from the field that a ball can be before it is ignored
max_distance_from_field: 1.0
