log_level: DEBUG

# mujoco_playground K1 joystick walk policy (79-obs / 22-action ONNX, contract pinned in
# NUSim docs/OBS_ACTION_CONTRACT.md). All joint arrays are in the Booster SDK
# JointIndexK1 serial order (head x2, L arm x4, R arm x4, L leg x6, R leg x6).
#
# The 79-obs contract drops the three base-linear-velocity entries the 82-obs models
# carried: there is no measured linear velocity on the real K1 in CUSTOM mode, so it is
# now a critic-only privileged quantity. The older 82-obs checkpoints
# (k1_walk_v1_20260723_617M.onnx, k1_walk.onnx) are NOT loadable against this module.
model_path: "k1_walk_v2_20260811_4012M.onnx"

# Run inference on the GPU with TensorRT. Falls back to OpenVINO CPU automatically when
# no CUDA device is visible (the container needs --gpus), so this is safe to leave on.
use_tensorrt: true

gait_frequency: 1.5 # Hz, phase advance rate (training randomizes U(1.25, 1.75))
stand_threshold: 0.01 # command norm below which the phase obs pins to [pi, pi] (standing)
action_scale: 1.0 # global multiplier on action_scale_joint (training config action_scale)

# The policy does not own the head; its two targets are replaced with the latest
# BoosterHeadRot command and tracked with these gains (higher than the training head kp
# because there is no gravity feed-forward on this side of the wire).
head:
  kp: 10.0
  kd: 0.5

# In-walk kick emulation: forward velocity burst (same emulation as skill::K1Walk)
kick:
  velocity: [0.5, 0, 0]
  duration: 0.5

# Training-time actuation, mirrored from the playground k1_mjx_feetonly.xml: kp = its
# position-actuator gains; kd = its joint damping; action_scale_joint =
# 0.25 * effort_limit / kp (booster_train convention).
kp: [3.948, 3.948,
     3.948, 3.948, 3.948, 3.948, 3.948, 3.948, 3.948, 3.948,
     30.201, 21.448, 17.846, 60.402, 35.692, 35.692,
     30.201, 21.448, 17.846, 60.402, 35.692, 35.692]
kd: [0.251, 0.251,
     0.251, 0.251, 0.251, 0.251, 0.251, 0.251, 0.251, 0.251,
     3.605, 2.56, 2.13, 4.807, 4.26, 4.26,
     3.605, 2.56, 2.13, 4.807, 4.26, 4.26]
action_scale_joint: [0.3799, 0.3799,
                     0.8865, 0.8865, 0.8865, 0.8865, 0.8865, 0.8865, 0.8865, 0.8865,
                     0.5629, 0.8859, 0.5365, 0.4636, 0.2683, 0.2683,
                     0.5629, 0.8859, 0.5365, 0.4636, 0.2683, 0.2683]
# Training keyframe ("home"): arms tucked, legs crouched
default_pose: [0, 0,
               0, -1.3, 0, 0,
               0, 1.3, 0, 0,
               -0.2, 0, 0, 0.4, -0.2, 0,
               -0.2, 0, 0, 0.4, -0.2, 0]

# Hard joint ranges of the trained model (k1_mjx_feetonly.xml jnt_range), used to clamp the
# commanded position. A saturated action already commands past these on several joints --
# e.g. knee default 0.4 with action_scale 0.4636 reaches -0.064 at a = -1, below the 0.0
# hard stop -- and MuJoCo absorbs that silently while the robot does not.
joint_lower: [-1.000, -0.349,
              -3.316, -1.740, -2.270, -2.440,
              -3.316, -1.570, -2.270,  0.000,
              -1.800, -0.400, -1.000,  0.000, -0.870, -0.345,
              -1.800, -1.570, -1.000,  0.000, -0.870, -0.345]
joint_upper: [ 1.000,  0.855,
               1.220,  1.570,  2.270,  0.000,
               1.220,  1.740,  2.270,  2.440,
               1.570,  1.570,  1.000,  2.230,  0.345,  0.345,
               1.570,  0.400,  1.000,  2.230,  0.345,  0.345]
