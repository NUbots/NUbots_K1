# Controls the minimum log level that NUClear log will display
log_level: INFO
# Name of the boost::interprocess shared memory segment that NUbridge reads kick
# decisions from and republishes as a ROS2 topic. Must match the "publishers" path
# (with '/' replaced by '_') configured in NUbridge's topics.yaml.
kick_decision_segment: _kick_ball
# Maximum distance (metres) the ball can be from the robot for a kick to start or
# continue. If the ball moves further away than this, the kick is stopped.
max_kick_distance: 0.8

# Kick profiles tuned for the Booster K1. version: 1 = standard, 2 = hard.
# duration is how long to let the kick run before reporting the task as done
# (the SDK gives no completion feedback).
profiles:
  balanced:
    version: 1
    duration: 1.2
  powerful:
    version: 2
    duration: 1.8

autonomous:
  goal_angle_threshold: 0.25
  goal_distance_threshold: 4.0
  obstacle_angle_threshold: 0.35
  obstacle_distance_threshold: 1.0
