# Controls the minimum log level that NUClear log will display
log_level: INFO

# FAST - as fast as possible
# REALTIME - as fast as the messages were recorded
# SEQUENTIAL - one message at a time, waits for all message sub tasks to complete before continuing
# SEQUENTIAL keeps the run deterministic and lets the localisation keep up with every frame.
playback_mode: SEQUENTIAL

# Where the field pose estimates are written, relative to the working directory (the build directory
# under `./b run`). The file is <first nbs file's name>_<binary name>.csv, e.g.
# 20260924T10_00_00_localisation_srif.csv.
output_directory: recordings/localisation_playback

# The inputs both field localisation modules need. Never play back message.localisation.Field: that is
# what is being regenerated.
messages:
  message.input.Sensors: true # odometry (Htw, vTw) and IMU, for both
  message.vision.FieldIntersections: true # NLopt's measurement
  message.vision.Goals: true # NLopt's startup/goal-post measurement
  message.vision.BoundingBoxes: true # SRIF's measurement (landmark boxes and Hcw)
  message.input.Image: false # SRIF's side disambiguator only, which is off by default
