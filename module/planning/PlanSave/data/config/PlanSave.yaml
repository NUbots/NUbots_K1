log_level: INFO

# Ball model. The block policy was trained on commands computed with exactly this model (the mjlab goalkeeper
# task's ShotCommand), so these match that task, not the field: change them together with a retrain.
ball:
  # Rolling deceleration (m/s^2); ShotCommandCfg.rolling_deceleration, also BallLocalisation's motion model
  rolling_deceleration: 0.5
  # Slowest ball (m/s) that counts as travelling; ShotCommandCfg.min_shot_speed
  min_shot_speed: 0.3
  # Longest time to arrival (s) the policy is told about a shot; ShotCommandCfg.max_time
  max_time: 3.0
  # Oldest ball estimate (s) planned with
  timeout: 0.5
  # Widening of the ball filter's velocity covariance (sigma factor) over the first moments of a shot. The NEES
  # check (tumminello/ball-covariance-check) found it ~2x optimistic in the first 0.3 s, but through the full stack
  # in NUSim (GoalieShotBenchmark, 22 Sep) sigma(dy) at the commit was 1.41 m with 2x against an actual 0.07 m RMS
  # error, and 0.93 m against 0.05 m without: the filter's own kick handling already opens it far enough. Without
  # the widening the goalie saved 28/40 against 25/40, committed 0.02 s sooner, and the envelope's expected saves
  # came closer (17 against 12, for 28 and 25).
  kick_widening:
    window: 0.3
    factor: 1.0

decision:
  # Commit to a block only for a shot at least this likely to go in. The command itself follows the training rule
  # (the ball reaches the goalie's line within max_time), whatever the goal line says.
  min_p_on_target: 0.5
  # Hold the ready stance while our own ball estimate is within this distance (m) of the goalie, so a close shot
  # finds it in the state the envelope was measured from (mjlab shots start 2.0-4.5 m out). Further out the walk
  # keeps positioning it, and a shot switches it straight to the block. That start, from the walk, is not in the
  # envelope yet (PLAN.md: measure it from both starting states); this is the stopgap until it is.
  guard_distance: 3.0
  # Extra distance (m) the ball must go before the goalie stops guarding, so it does not flicker at the edge
  guard_hysteresis: 0.5
  # ...and at least this far (m) in front of the goalie's line. In NUSim vision sees balls on the goalie's own feet
  # and hands; guarding one of those keeps the head on it, which keeps it seen.
  guard_min_ahead: 0.3
  # A shot is over once the ball is no longer on its way by the training rule (stopped, past the goalie or going
  # away) or lost, for this long (s). The delay also rides out the estimate flickering early in a shot.
  release_delay: 0.5
  # Below this expected success the block is still run (it is the only skill), but logged as a gap. This is where a
  # dive policy would be chosen, if the gap analysis ever calls for one.
  block_threshold: 0.3

envelope:
  # One-sided z of the Wilson lower bound on each cell's save rate (1.64 = 95%)
  confidence_z: 1.64
  # Cells with fewer shots than this count as 0% success
  min_trials: 10

# Handing a walking goalie to the block policy (GUARD or BLOCK). The policy was trained from a standing start, and
# taking over mid-stride topples it, so the hand-off waits for both feet to be down (the ankles level, from the leg
# kinematics and the IMU: the K1 has no foot contact sensors). Until then the goalie carries on as in IDLE.
handoff:
  enabled: true
  # Ankles within this height of each other (m) count as both feet down. K1WalkPolicy's swing foot only rises ~2.5 cm
  # (NUSim, 24 Sep), so this is the moment the feet swap over rather than a foot merely being low.
  foot_height_tolerance: 0.005
  # Longest wait (s) before handing off anyway. In the same recordings the ankles came level every 0.18 s (median)
  # while walking, and within 0.30 s nine times in ten.
  max_wait: 0.35

# Where the goalie stands while no shot is on its way (tools/policy/save_positioning_prototype.py has the maths and
# plots). Every spot from min_depth off the goal line out to the penalty area line is scored by the block policy's
# save probability (SaveCapability.yaml) against every straight shot at the goal from the ball, facing the ball; the
# goalie walks to the spot closest to the goal line within near_best of the best score. The penalty area and goal
# come from the field.
positioning:
  # Off: leave positioning to the walk below Save (purpose::Goalie's strafe)
  enabled: true
  # Kick to a live Block command (s); GoalieShotBenchmark measured a median 0.23 s through the stack
  t_lat: 0.2
  # Shot speeds the opponent kicks at (m/s), n_speed spread evenly over the range; aim points spread across the goal
  speed_range: [1.5, 4.0]
  n_speed: 11
  n_aim: 41
  # cvar: the save rate over the worst cvar_fraction of aim points (a shooter who picks the goalie's gaps); mean: over
  # all of them. The mean barely cares how far out the goalie stands and leaves the near post open on tight angles.
  objective: cvar
  cvar_fraction: 0.2
  # Subtracted from a spot's score per metre off the goal line, for what one shot doesn't show (dribbles, passes)
  line_penalty: 0.0
  # Closest the goalie stands to the ball (m)
  min_ball_distance: 0.5
  # Guesses at how much worse the real goalie is than mjlab's, until it is measured: every combination of an extra
  # delay (s) and a reach scale. regret: choose the spot that is never far from the best for any of them; mean: the
  # best on average over them.
  extra_lat: [0.0, 0.2]
  reach_scale: [1.0, 0.7]
  robust: regret
  # Take the spot closest to the goal line within this of the best score: the score is nearly flat in depth
  near_best: 0.02
  # Spots considered (m): this grid, from min_depth off the goal line out to the penalty area line
  grid_step: 0.1
  min_depth: 0.05
  # Oldest chosen spot (s) walked to; it is rechosen at 5 Hz
  target_timeout: 1.0
