syntax = "proto3";

package message.skill;

/// Drive the K1 block (save) policy. Emitted every tick by the save planner while the goalie is
/// guarding; the command is recomputed each tick from the latest ball estimate, so the policy is
/// closed-loop through it. All quantities are in the robot frame {r} (planar odometry base frame:
/// origin at the torso projected to the ground, x forward, y left), matching the training
/// contract in module/skill/K1BlockPolicy/README.md.
message Block {
    /// Whether a shot is being defended. When false the policy holds its ready stance and the
    /// remaining fields must be zero.
    bool active = 1;
    /// Lateral offset (m, +left) at which the ball's predicted path crosses the robot's frontal
    /// plane (x = 0 in {r})
    double dy = 2;
    /// Predicted time (s) until the ball reaches that crossing
    double time_to_arrival = 3;
    /// Current ball speed (m/s) from the ball filter
    double ball_speed = 4;
}
